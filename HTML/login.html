<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101114">
  <meta name="robots" content="noindex, nofollow">
  <title>Optmus | Acesse o Sistema</title>
  <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>
  <main class="login-scene" id="loginScene">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="orbit orbit-one"></div>
    <div class="orbit orbit-two"></div>

    <section class="login-frame" id="loginFrame" aria-label="Acesso ao sistema Optmus">
      <div class="mascot-side">
        <div class="mascot-glow"></div>
        <div class="mascot-stage" id="mascotStage" aria-label="Optmus, assistente robótica">
          <img
            src="../ASSETS/optmus-corpo.png"
            class="mascot-layer mascot-body"
            id="optmusBody"
            alt=""
            aria-hidden="true"
          >
          <img
            src="../ASSETS/optmus-cabeca.png"
            class="mascot-layer mascot-head"
            id="optmusHead"
            alt="Cabeça da Optmus"
            draggable="false"
          >
        </div>
        <div class="mascot-greeting" id="mascotGreeting" aria-live="polite">
          <span class="greeting-dot"></span>
          <span>Olá! Vamos começar?</span>
        </div>
      </div>

      <div class="form-side">
        <div class="form-topline">
          <span class="eyebrow">AMBIENTE DE ACESSO</span>
          <span class="system-status"><i></i> SISTEMA DISPONÍVEL</span>
        </div>

        <div class="form-heading">
          <div class="heading-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </div>
          <div>
            <p class="eyebrow">BEM-VINDO(A)</p>
            <h1>Acesse o Sistema</h1>
            <p class="form-subtitle">Informe seus dados para continuar.</p>
          </div>
        </div>

        <form id="loginForm" novalidate>
          <label class="field-label" for="nome">Nome</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
            <input id="nome" name="nome" type="text" placeholder="Digite seu nome" autocomplete="name" required>
          </div>

          <label class="field-label" for="dashboard">Dashboard</label>
          <div class="input-wrap select-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            <select id="dashboard" name="dashboard" required>
              <option value="" selected disabled>Selecione seu dashboard</option>
              <option value="Inteligência de Rede">Inteligência de Rede</option>
              <option value="Captação/Cadastro">Captação / Cadastro</option>
            </select>
            <span class="select-chevron">⌄</span>
          </div>

          <label class="field-label" for="email">E-mail</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <input id="email" name="email" type="email" placeholder="seu.email@assefaz.org.br" autocomplete="email" required>
          </div>

          <p class="form-feedback" id="formFeedback" role="alert"></p>

          <button class="submit-button" id="submitButton" type="submit">
            <span>Entrar</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
          </button>
        </form>

        <div class="form-footer">
          <span>ACESSO RESTRITO A USUÁRIOS AUTORIZADOS</span>
          <span class="footer-line"></span>
        </div>
      </div>
    </section>

    <div class="brand-signature" aria-label="Optmus">
      <span class="brand-symbol"><i></i></span>
      <span>OPTMUS</span>
    </div>
    <div class="screen-corner corner-left"></div>
    <div class="screen-corner corner-right"></div>
  </main>

  <script src="../JAVA/login.js"></script>
</body>
</html>
